    <script>
      try {
        const saved = localStorage.getItem("theme");
        const theme =
          saved === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : saved === "light"
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
      } catch {}
    </script>
