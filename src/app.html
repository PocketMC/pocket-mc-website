<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="google-site-verification" content="xo-fJdA8-y3mHNGwgR5dmHEUCVLoCD04pnYCqhpPVao" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/logo.webp" />
		<meta name="theme-color" content="#121212" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			media="print"
			onload="this.media='all'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			/>
		</noscript>
		<script>
			const root = document.documentElement;
			root.classList.add('js');

			try {
				const stored = localStorage.getItem('theme');
				if (stored === 'light' || stored === 'dark') {
					root.dataset.theme = stored;
				}
			} catch {}

			try {
				const nav = performance.getEntriesByType('navigation')[0];
				if (location.hash && (!nav || nav.type === 'reload')) {
					history.replaceState(history.state, '', location.pathname + location.search);
				}
			} catch {}

			addEventListener('beforeunload', () => scrollTo(0, 0));

			const settled = () => root.classList.add('fonts');

			if (document.fonts) {
				document.fonts.ready.then(settled);
				setTimeout(settled, 900);
			} else {
				settled();
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
